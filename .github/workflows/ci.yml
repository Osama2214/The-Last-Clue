name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Restore locked dependencies
        run: dotnet restore LastClue.sln --locked-mode
      - name: Build
        run: dotnet build LastClue.sln --configuration Release --no-restore
      - name: Install Playwright Chromium
        shell: pwsh
        run: ./tests/LastClue.UI.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
      - name: Start SQL Server for integration tests
        shell: bash
        run: |
          set -euo pipefail
          password="Aa9!$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          docker run --detach --rm --name last-clue-ci-sql \
            --publish 127.0.0.1::1433 \
            --env ACCEPT_EULA=Y --env MSSQL_PID=Developer --env MSSQL_MEMORY_LIMIT_MB=2048 \
            --env MSSQL_SA_PASSWORD="$password" mcr.microsoft.com/mssql/server:2022-latest
          for attempt in {1..30}; do
            if docker exec --env SQLCMDPASSWORD="$password" last-clue-ci-sql \
              /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -l 2 -Q 'SELECT 1' >/dev/null 2>&1; then
              address=$(docker port last-clue-ci-sql 1433/tcp)
              port=${address##*:}
              connection="Server=127.0.0.1,$port;Database=master;User ID=sa;Password=$password;Encrypt=True;TrustServerCertificate=True"
              echo "::add-mask::$connection"
              echo "LAST_CLUE_TEST_SQLSERVER=$connection" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 2
          done
          echo "SQL Server did not become ready"
          exit 1
      - name: Test
        run: dotnet test LastClue.sln --configuration Release --no-build --collect:"XPlat Code Coverage" --logger trx --results-directory TestResults
      - name: Generate Application coverage
        if: ${{ !cancelled() && hashFiles('TestResults/**/coverage.cobertura.xml') != '' }}
        run: |
          dotnet tool restore
          dotnet reportgenerator "-reports:TestResults/**/coverage.cobertura.xml" "-targetdir:Coverage" "-assemblyfilters:+LastClue.Application" "-reporttypes:Html"
      - name: Stop test database
        if: always()
        run: docker stop last-clue-ci-sql || true
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build container
        run: docker compose build --pull
      - name: Verify container
        run: |
          docker compose up --detach --no-build --wait --wait-timeout 90
          curl --fail --silent --show-error http://127.0.0.1:8080/ | grep -q 'The Last Clue'
          curl --fail --silent --show-error http://127.0.0.1:8080/css/site.css --output /dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/health
          test "$(curl --silent --show-error --output /tmp/last-clue-ready.json --write-out '%{http_code}' http://127.0.0.1:8080/health/ready)" = "503"
          test "$(docker compose exec -T web id -u)" != "0"
          test "$(curl --silent --show-error --output /tmp/last-clue-api-error.json --write-out '%{http_code}' http://127.0.0.1:8080/api/v1/foundationapi/errors/unexpected)" = "404"
          python3 -c 'import json, uuid; body=json.load(open("/tmp/last-clue-api-error.json")); assert body["code"] == "NOT_FOUND"; uuid.UUID(body["correlationId"])'
      - name: Container logs and shutdown
        if: always()
        run: |
          docker compose logs --no-color
          docker compose down
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
      - name: Upload Application coverage
        if: ${{ !cancelled() && hashFiles('Coverage/index.html') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: application-coverage
          path: Coverage
      - name: Publish application
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: dotnet publish src/LastClue.Web/LastClue.Web.csproj --configuration Release --no-build --output artifacts/web
      - name: Upload application
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ github.sha }}
          path: artifacts/web
