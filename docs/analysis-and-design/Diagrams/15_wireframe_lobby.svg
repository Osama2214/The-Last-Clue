<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120"><rect width="1600" height="1120" fill="white"/><rect x="30" y="30" width="1540" height="1060" fill="white" stroke="black" stroke-width="2"/><text x="60" y="84.4" font-family="Consolas,monospace" font-size="28" font-weight="700">THE LAST CLUE</text><text x="600" y="84.0" font-family="Consolas,monospace" font-size="25" font-weight="700">Room and lobby</text><path d="M30 115 L1570 115" stroke="black" fill="none" stroke-width="2"/><text x="60" y="1083.6" font-family="Consolas,monospace" font-size="17" font-weight="400">UI wireframe | Illustrative data | English view; Arabic uses a right-to-left layout</text><text x="60" y="161.4" font-family="Consolas,monospace" font-size="23" font-weight="700">Room: CLUE42  |  Language: English  |  Players: 6 / 8</text><rect x="70" y="205" width="820" height="570" fill="white" stroke="black" stroke-width="2"/><text x="90" y="242.2" font-family="Consolas,monospace" font-size="24" font-weight="700">Players</text><path d="M70 267 L890 267" stroke="black" fill="none" stroke-width="2"/><text x="95" y="310.8" font-family="Consolas,monospace" font-size="21" font-weight="700">NAME                  ROOM ROLE       STATUS</text><text x="95" y="371.8" font-family="Consolas,monospace" font-size="21" font-weight="400">Player One (you)      Host            Ready</text><text x="95" y="433.8" font-family="Consolas,monospace" font-size="21" font-weight="400">Player Two            Member          Ready</text><text x="95" y="495.8" font-family="Consolas,monospace" font-size="21" font-weight="400">Player Three          Member          Ready</text><text x="95" y="557.8" font-family="Consolas,monospace" font-size="21" font-weight="400">Player Four           Member          Ready</text><text x="95" y="619.8" font-family="Consolas,monospace" font-size="21" font-weight="400">Player Five           Member          Ready</text><text x="95" y="681.8" font-family="Consolas,monospace" font-size="21" font-weight="400">Player Six            Member          Ready</text><rect x="940" y="205" width="590" height="570" fill="white" stroke="black" stroke-width="2"/><text x="960" y="242.2" font-family="Consolas,monospace" font-size="24" font-weight="700">Game rules</text><path d="M940 267 L1530 267" stroke="black" fill="none" stroke-width="2"/><text x="965" y="310.2" font-family="Consolas,monospace" font-size="19" font-weight="400">4-8 players; exactly one criminal.</text><text x="965" y="339.2" font-family="Consolas,monospace" font-size="19" font-weight="400">6 players: two detectives.</text><text x="965" y="368.2" font-family="Consolas,monospace" font-size="19" font-weight="400">Three rounds.</text><text x="965" y="397.2" font-family="Consolas,monospace" font-size="19" font-weight="400">At most two accusations per game.</text><text x="965" y="426.2" font-family="Consolas,monospace" font-size="19" font-weight="400">At most one accusation per round.</text><text x="965" y="455.2" font-family="Consolas,monospace" font-size="19" font-weight="400">Two detectives must agree.</text><text x="965" y="484.2" font-family="Consolas,monospace" font-size="19" font-weight="400">Roles are assigned when play starts.</text><rect x="965" y="617" width="540" height="48" fill="#f2f2f2" stroke="black" stroke-width="2"/><text x="978" y="644.2" font-family="Consolas,monospace" font-size="19" font-weight="700">Not ready</text><rect x="965" y="685" width="540" height="48" fill="#f2f2f2" stroke="black" stroke-width="2"/><text x="978" y="712.2" font-family="Consolas,monospace" font-size="19" font-weight="700">Start game (host only)</text><rect x="70" y="815" width="1460" height="190" fill="white" stroke="black" stroke-width="2"/><text x="90" y="852.2" font-family="Consolas,monospace" font-size="24" font-weight="700">Room actions</text><path d="M70 877 L1530 877" stroke="black" fill="none" stroke-width="2"/><text x="95" y="912.8" font-family="Consolas,monospace" font-size="21" font-weight="400">All six players are ready. The host can start the game.</text><rect x="1080" y="892" width="425" height="48" fill="#f2f2f2" stroke="black" stroke-width="2"/><text x="1093" y="919.2" font-family="Consolas,monospace" font-size="19" font-weight="700">Leave room</text></svg>