<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120"><rect width="1600" height="1120" fill="white"/><rect x="30" y="30" width="1540" height="1060" fill="white" stroke="black" stroke-width="2"/><text x="60" y="84.4" font-family="Consolas,monospace" font-size="28" font-weight="700">THE LAST CLUE</text><text x="600" y="84.0" font-family="Consolas,monospace" font-size="25" font-weight="700">Administration</text><path d="M30 115 L1570 115" stroke="black" fill="none" stroke-width="2"/><text x="60" y="1083.6" font-family="Consolas,monospace" font-size="17" font-weight="400">UI wireframe | Illustrative data | English view; Arabic uses a right-to-left layout</text><rect x="60" y="180" width="300" height="830" fill="white" stroke="black" stroke-width="2"/><text x="80" y="217.2" font-family="Consolas,monospace" font-size="24" font-weight="700">Navigation</text><path d="M60 242 L360 242" stroke="black" fill="none" stroke-width="2"/><text x="80" y="295.2" font-family="Consolas,monospace" font-size="19" font-weight="400">Users</text><text x="80" y="324.2" font-family="Consolas,monospace" font-size="19" font-weight="400"></text><text x="80" y="353.2" font-family="Consolas,monospace" font-size="19" font-weight="400">Public game monitor</text><text x="80" y="382.2" font-family="Consolas,monospace" font-size="19" font-weight="400"></text><text x="80" y="411.2" font-family="Consolas,monospace" font-size="19" font-weight="400">Fallback case library</text><text x="80" y="440.2" font-family="Consolas,monospace" font-size="19" font-weight="400"></text><text x="80" y="469.2" font-family="Consolas,monospace" font-size="19" font-weight="400">Future game settings</text><text x="80" y="498.2" font-family="Consolas,monospace" font-size="19" font-weight="400"></text><text x="80" y="527.2" font-family="Consolas,monospace" font-size="19" font-weight="400">Audit history</text><rect x="400" y="180" width="1140" height="830" fill="white" stroke="black" stroke-width="2"/><text x="420" y="217.2" font-family="Consolas,monospace" font-size="24" font-weight="700">Fallback case library</text><path d="M400 242 L1540 242" stroke="black" fill="none" stroke-width="2"/><text x="425" y="290.2" font-family="Consolas,monospace" font-size="19" font-weight="400">Published families: 5  |  Each published version has 10 validated variants.</text><text x="425" y="351.0" font-family="Consolas,monospace" font-size="20" font-weight="700">CASE FAMILY</text><text x="675" y="351.0" font-family="Consolas,monospace" font-size="20" font-weight="700">VERSION</text><text x="775" y="351.0" font-family="Consolas,monospace" font-size="20" font-weight="700">STATUS</text><text x="905" y="351.0" font-family="Consolas,monospace" font-size="20" font-weight="700">COVERAGE</text><text x="425" y="405.2" font-family="Consolas,monospace" font-size="19" font-weight="400">The Missing Ledger       1         Published    10 / 10</text><text x="425" y="460.2" font-family="Consolas,monospace" font-size="19" font-weight="400">The Gallery Switch       1         Published    10 / 10</text><text x="425" y="515.2" font-family="Consolas,monospace" font-size="19" font-weight="400">The Silent Study         1         Published    10 / 10</text><text x="425" y="570.2" font-family="Consolas,monospace" font-size="19" font-weight="400">The Midnight Parcel      1         Published    10 / 10</text><text x="425" y="625.2" font-family="Consolas,monospace" font-size="19" font-weight="400">The Last Reservation     1         Published    10 / 10</text><text x="425" y="710.2" font-family="Consolas,monospace" font-size="19" font-weight="400">Coverage: 4, 5, 6, 7 and 8 players in both Arabic and English.</text><rect x="425" y="755" width="340" height="48" fill="#f2f2f2" stroke="black" stroke-width="2"/><text x="438" y="782.2" font-family="Consolas,monospace" font-size="19" font-weight="700">Edit new version</text><rect x="790" y="755" width="320" height="48" fill="#f2f2f2" stroke="black" stroke-width="2"/><text x="803" y="782.2" font-family="Consolas,monospace" font-size="19" font-weight="700">Validate version</text><rect x="1135" y="755" width="375" height="48" fill="#f2f2f2" stroke="black" stroke-width="2"/><text x="1148" y="782.2" font-family="Consolas,monospace" font-size="19" font-weight="700">Publish version</text><text x="425" y="869.4" font-family="Consolas,monospace" font-size="18" font-weight="400">Publishing requires all 10 variants to pass validation.</text><text x="425" y="897.4" font-family="Consolas,monospace" font-size="18" font-weight="400">At least five complete active case families must remain available.</text><text x="425" y="925.4" font-family="Consolas,monospace" font-size="18" font-weight="400">Published changes apply to future games; current snapshots stay unchanged.</text><text x="425" y="953.4" font-family="Consolas,monospace" font-size="18" font-weight="400">The game monitor shows public status only.</text></svg>